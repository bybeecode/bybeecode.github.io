<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>달란트시장</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#222}
.c{text-align:center;padding:32px;max-width:340px}
h1{color:#16a34a;margin:0 0 12px;font-size:28px}
p{color:#666;line-height:1.5;margin:6px 0}
.btn{display:inline-block;margin-top:20px;padding:14px 28px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none}
.btn:active{opacity:.85}
.hint{margin-top:16px;font-size:13px;color:#999}
</style>
</head><body><div class="c">
<h1>달란트시장</h1>
<p>교회 공동체 중고거래 &amp; 커뮤니티</p>
<a id="open" class="btn" href="talentmarket:///home">앱에서 열기</a>
<p class="hint">앱이 설치돼 있지 않다면 앱을 먼저 설치해 주세요.</p>
</div>
<script>
(function(){
  var btn = document.getElementById('open');
  btn.addEventListener('click', function(e){
    e.preventDefault();
    window.location.href = 'talentmarket:///home';
  });
})();
</script>
</body></html>
