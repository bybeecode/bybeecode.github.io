<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>달란트시장에서 열기</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#222}
.c{text-align:center;padding:32px;max-width:340px}
h1{color:#16a34a;margin:0 0 12px;font-size:28px}
p{color:#666;line-height:1.5;margin:6px 0}
.btn{display:inline-block;margin-top:20px;padding:14px 28px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none}
.btn:active{opacity:.85}
.hint{margin-top:16px;font-size:13px;color:#999}
</style>
</head><body><div class="c">
<h1>달란트시장</h1>
<p>이 링크는 달란트시장 앱에서 열려요.</p>
<a id="open" class="btn" href="#">앱에서 열기</a>
<p class="hint">버튼을 눌러도 안 열리면 앱을 먼저 설치해 주세요.</p>
</div>
<script>
(function(){
  // GitHub Pages 404 fallback 컨텍스트에서도 원래 요청 경로가 유지된다.
  var path = window.location.pathname + window.location.search;
  // 커스텀 스킴(빈 authority) → talentmarket:///product/123 → 앱이 go_router 로 라우팅.
  var appUrl = 'talentmarket://' + path;
  var btn = document.getElementById('open');
  btn.setAttribute('href', appUrl);
  function openApp(){ window.location.href = appUrl; }
  btn.addEventListener('click', function(e){ e.preventDefault(); openApp(); });
  // 자동 시도: 일부 인앱 브라우저는 사용자 제스처를 요구하므로 버튼도 함께 제공한다.
  setTimeout(openApp, 100);
})();
</script>
</body></html>
